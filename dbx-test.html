<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Dropbox (descartável)</title>
<style>
  body{font-family:system-ui,sans-serif;margin:16px;max-width:720px}
  button{font-size:16px;padding:10px 14px;margin:4px 4px 4px 0}
  pre{background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all;font-size:13px}
  code{word-break:break-all}
</style>
</head>
<body>
<h2>Teste de ligação Dropbox (descartável — apagar após o teste)</h2>
<p>Redirect URI usada: <code id="ru"></code></p>
<p>Esta URI tem de estar registada em <em>Redirect URIs</em> na App Console do Dropbox.</p>
<button id="login">1. Iniciar sessão</button>
<button id="list">2. Listar pasta da app</button>
<button id="dl">3. Descarregar 1.º ficheiro</button>
<pre id="out"></pre>
<script>
(function () {
  'use strict';
  const APP_KEY = 'clt6iri77fmzaxk';
  const REDIRECT = location.origin + location.pathname;
  const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const out = (m) => { document.getElementById('out').textContent += m + '\n'; };
  document.getElementById('ru').textContent = REDIRECT;

  function rnd(n) {
    const b = crypto.getRandomValues(new Uint8Array(n));
    return Array.from(b, x => CH[x % CH.length]).join('');
  }
  function b64u(buf) {
    let s = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // Passo 1: PKCE (S256), sem segredo da app
  async function login() {
    const v = rnd(64), s = rnd(24);
    sessionStorage.setItem('v', v);
    sessionStorage.setItem('s', s);
    const c = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
    const p = new URLSearchParams({ client_id: APP_KEY, redirect_uri: REDIRECT, response_type: 'code',
      code_challenge: c, code_challenge_method: 'S256', token_access_type: 'offline', state: s });
    location.href = 'https://www.dropbox.com/oauth2/authorize?' + p.toString();
  }

  // Passo 2: regresso com ?code= — trocar por tokens (teste de CORS em api.dropboxapi.com)
  async function finish() {
    const q = new URLSearchParams(location.search);
    const code = q.get('code');
    if (!code) return;
    history.replaceState(null, '', REDIRECT);
    if (q.get('state') !== sessionStorage.getItem('s')) { out('ERRO: state não coincide'); return; }
    try {
      const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ code: code, grant_type: 'authorization_code', client_id: APP_KEY,
          redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem('v') || '' })
      });
      out('Troca de tokens: HTTP ' + r.status);
      if (!r.ok) { out(await r.text()); return; }
      const j = await r.json();
      sessionStorage.setItem('at', j.access_token);
      out('Refresh token recebido: ' + (!!j.refresh_token) + ' (valor não mostrado)');
      out('Access token válido ~' + Math.round(j.expires_in / 60) + ' min. Pode testar 2 e 3.');
    } catch (e) {
      out('ERRO de rede/CORS na troca de tokens: ' + e);
    }
  }

  // Passo 3: listar a pasta da app (api.dropboxapi.com)
  async function list() {
    const at = sessionStorage.getItem('at');
    if (!at) { out('Sem token: faça o passo 1.'); return; }
    try {
      const r = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + at, 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: '', recursive: false })
      });
      out('Listar: HTTP ' + r.status);
      const t = await r.text();
      out(t.slice(0, 2000));
      try { window._entries = JSON.parse(t).entries || []; } catch (e) { window._entries = []; }
    } catch (e) {
      out('ERRO de rede/CORS ao listar: ' + e);
    }
  }

  // Passo 4: descarregar 1.º ficheiro (content.dropboxapi.com — o host mais sensível a CORS)
  async function dl() {
    const at = sessionStorage.getItem('at');
    if (!at) { out('Sem token: faça o passo 1.'); return; }
    const f = (window._entries || []).find(e => e['.tag'] === 'file');
    if (!f) { out('Sem ficheiros na pasta da app (faça o passo 2 primeiro).'); return; }
    try {
      const r = await fetch('https://content.dropboxapi.com/2/files/download', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + at, 'Dropbox-API-Arg': JSON.stringify({ path: f.path_lower }) }
      });
      out('Descarregar "' + f.name + '": HTTP ' + r.status + ', ' + (await r.arrayBuffer()).byteLength + ' bytes');
    } catch (e) {
      out('ERRO de rede/CORS ao descarregar: ' + e);
    }
  }

  document.getElementById('login').onclick = login;
  document.getElementById('list').onclick = list;
  document.getElementById('dl').onclick = dl;
  finish();
})();
</script>
</body>
</html>
